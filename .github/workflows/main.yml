name: Compilar para GameCube
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: turbo_rugido
          path: turbo_rugido.dol
